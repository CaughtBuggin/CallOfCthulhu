<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COCOCH — Call of Cthulhu 7e Character Sheets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #101214;
  --bg-panel: #181b1f;
  --bg-elev: #20242a;
  --bg-hover: #272c33;
  --border: #2e343d;
  --border-strong: #3a414c;
  --text: #e6e1d5;
  --text-dim: #9aa0a8;
  --text-faint: #6b7280;
  --accent: #c69c6d;
  --accent-strong: #e0b989;
  --green: #7cb88a;
  --red: #d97777;
  --blue: #7aa2c2;
  --purple: #b39bc4;
  --gold: #d8b66a;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
  --font-body: "Inter", system-ui, sans-serif;
  --font-serif: "IM Fell English", Georgia, serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(198, 156, 109, 0.06), transparent 60%),
    var(--bg);
}

button {
  font-family: inherit;
  cursor: pointer;
}

input, select, textarea {
  font-family: inherit;
  color: var(--text);
}

/* Header */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(16, 18, 20, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.app-header__inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  background: none;
  border: none;
  color: var(--text);
  padding: 0;
}
.brand__logo { font-size: 22px; color: var(--accent); }
.brand__text {
  font-family: var(--font-serif);
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent-strong);
}
.brand__sub { font-size: 12px; color: var(--text-dim); letter-spacing: 0.5px; }
.app-header__nav { display: flex; gap: 8px; margin-left: auto; }
.nav-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--text-dim);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
}
.nav-btn:hover { color: var(--text); background: var(--bg-elev); }
.nav-btn.active { color: var(--accent-strong); border-color: var(--border-strong); background: var(--bg-elev); }

.app {
  flex: 1;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 20px 48px;
}

.app-footer {
  text-align: center;
  font-size: 12px;
  color: var(--text-faint);
  padding: 20px;
  border-top: 1px solid var(--border);
}

/* Generic components */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  transition: background 0.12s, border-color 0.12s, transform 0.05s;
}
.btn:hover { background: var(--bg-hover); border-color: var(--text-faint); }
.btn:active { transform: translateY(1px); }
.btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a140e;
}
.btn--primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn--danger { border-color: transparent; color: var(--red); }
.btn--danger:hover { background: rgba(217, 119, 119, 0.12); border-color: rgba(217, 119, 119, 0.4); }
.btn--ghost { background: none; }
.btn--sm { padding: 4px 8px; font-size: 12.5px; }

.icon-btn {
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  line-height: 1;
}
.icon-btn:hover { color: var(--text); background: var(--bg-hover); }

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.field label {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.field input, .field select, .field textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 14px;
  color: var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.field input[type="number"] { -moz-appearance: textfield; }
.field input[type="number"]::-webkit-inner-spin-button,
.field input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* Character list */
.list-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.list-head h1 { font-family: var(--font-serif); font-size: 28px; margin: 0; color: var(--text); }
.list-head .actions { display: flex; gap: 10px; flex-wrap: wrap; }

.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.char-card {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.08s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.char-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.char-card__name { font-family: var(--font-serif); font-size: 20px; color: var(--text); }
.char-card__meta { font-size: 13px; color: var(--text-dim); }
.char-card__stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  font-size: 12px;
}
.char-card__stat { background: var(--bg-elev); border-radius: var(--radius-sm); padding: 6px; text-align: center; }
.char-card__stat b { display: block; font-size: 15px; color: var(--accent-strong); }
.char-card__stat span { color: var(--text-dim); }
.char-card__actions { display: flex; gap: 6px; margin-top: auto; }
.char-card__actions .icon-btn { margin-left: auto; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-state h2 { font-family: var(--font-serif); font-size: 24px; margin: 0 0 8px; color: var(--text); }
.empty-state p { margin: 0 0 20px; }

/* Sheet */
.sheet-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.sheet-toolbar .back { margin-right: auto; }
.sheet-title { font-family: var(--font-serif); font-size: 26px; margin: 0; }

.sheet-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 900px) {
  .sheet-grid { grid-template-columns: 320px 1fr; }
  .sheet-grid--cols { grid-template-columns: 320px 1fr; }
}

.sheet-section-title {
  font-family: var(--font-serif);
  font-size: 18px;
  margin: 0 0 12px;
  color: var(--accent-strong);
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}

.identity-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.identity-grid .full { grid-column: 1 / -1; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.stat-box {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.12s;
}
.stat-box:hover { border-color: var(--accent); }
.stat-box__label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); }
.stat-box__value { font-size: 26px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.stat-box__half { font-size: 12px; color: var(--text-dim); }
.stat-box__fifth { font-size: 11px; color: var(--text-faint); }
.stat-box__value-input {
  width: 100%;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  padding: 2px 0;
  font-variant-numeric: tabular-nums;
}
.stat-box__value-input:hover { border-color: var(--border); }
.stat-box__value-input:focus { outline: none; border-color: var(--accent); background: var(--bg); }

.sheet-title {
  font-family: var(--font-serif);
  font-size: 26px;
  margin: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 4px 8px;
  min-width: 220px;
}
.sheet-title:hover { border-color: var(--border); }
.sheet-title:focus { outline: none; border-color: var(--accent); background: var(--bg); }

.derived-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.derived-box {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
}
.derived-box__label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); }
.derived-box__value { font-size: 20px; font-weight: 700; }
.derived-box__sub { font-size: 12px; color: var(--text-dim); }

/* Trackable resources */
.track-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.track-row:last-child { border-bottom: none; }
.track-row__label { flex: 1; font-size: 14px; }
.track-row__label small { color: var(--text-dim); }
.track-controls { display: flex; align-items: center; gap: 6px; }
.track-value {
  min-width: 60px;
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.track-value.low { color: var(--red); }
.track-value.zero { color: var(--red); font-weight: 700; }

/* Skill table */
.skill-filters {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}
.search-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 14px;
  width: 100%;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12.5px;
  cursor: pointer;
}
.tag:hover { color: var(--text); }
.tag.active { background: var(--accent); border-color: var(--accent); color: #1a140e; }

.skill-list { display: flex; flex-direction: column; }
.skill-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.skill-row:hover { background: var(--bg-elev); }
.skill-row__name { flex: 1; font-size: 14px; }
.skill-row__base { font-size: 12px; color: var(--text-faint); width: 34px; text-align: right; }
.skill-row__value {
  font-weight: 600;
  min-width: 34px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--accent-strong);
}
.skill-row__input {
  width: 52px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px 6px;
  font-size: 13px;
  text-align: right;
}

/* Roll panel */
.roll-panel { display: flex; flex-direction: column; gap: 16px; }
.roll-results {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 420px;
  overflow-y: auto;
}
.roll-result {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-left: 4px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.roll-result.fumble { border-left-color: var(--red); }
.roll-result.critical { border-left-color: var(--gold); }
.roll-result.extreme { border-left-color: var(--purple); }
.roll-result.hard { border-left-color: var(--blue); }
.roll-result.success { border-left-color: var(--green); }
.roll-result.fail { border-left-color: var(--text-faint); }
.roll-result__head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.roll-result__label { font-weight: 600; font-size: 14px; }
.roll-result__grade { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.roll-result__detail { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.roll-result__dice { font-size: 13px; color: var(--text-dim); }

/* Dice roller quick */
.dice-quick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dice-quick label { font-size: 13px; color: var(--text-dim); }
.dice-quick input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  font-size: 13px;
  color: var(--text);
}

.panel textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 14px;
  color: var(--text);
  resize: vertical;
  min-height: 70px;
}
.panel textarea:focus { outline: none; border-color: var(--accent); }

.bonus-toggle { display: flex; gap: 6px; }

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal {
  background: var(--bg-panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 22px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow);
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 { font-family: var(--font-serif); margin: 0 0 16px; }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* Toast */
.toast-root {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 200;
}
.toast {
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 14px;
  box-shadow: var(--shadow);
  animation: slideIn 0.2s ease;
}
.toast.error { border-left-color: var(--red); }
@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Layout helpers */
.split { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .split { grid-template-columns: 1fr 380px; } }
.col { display: flex; flex-direction: column; gap: 16px; }
.mt { margin-top: 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.text-dim { color: var(--text-dim); }
.text-faint { color: var(--text-faint); }
.mono { font-variant-numeric: tabular-nums; }

</style>
</head>

  <header class="app-header">
    <div class="app-header__inner">
      <button class="brand" id="brandHome" type="button">
        <span class="brand__logo">☾</span>
        <span class="brand__text">COCOCH</span>
        <span class="brand__sub">CoC 7e Character Sheets</span>
      </button>
      <nav class="app-header__nav">
        <button class="nav-btn" id="navHome" type="button">Characters</button>
      </nav>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="app-footer">
    <span>Call of Cthulhu is © Chaosium Inc. This is a fan-made tool.</span>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

const __mods = {};

__mods["js/core/storage.js"] = (function() {
// Character persistence via localStorage with JSON export/import.

const STORAGE_KEY = 'cococh.characters.v1';

function loadCharacters() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.warn('Failed to load characters', e);
    return [];
  }
}

function saveCharacters(characters) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(characters));
}

function getCharacter(id) {
  return loadCharacters().find((c) => c.id === id) || null;
}

function upsertCharacter(character) {
  const list = loadCharacters();
  const idx = list.findIndex((c) => c.id === character.id);
  character.updatedAt = Date.now();
  if (idx === -1) {
    list.unshift(character);
  } else {
    list[idx] = character;
  }
  saveCharacters(list);
  return character;
}

function deleteCharacter(id) {
  const list = loadCharacters().filter((c) => c.id !== id);
  saveCharacters(list);
  return list;
}

function duplicateCharacter(id) {
  const list = loadCharacters();
  const src = list.find((c) => c.id === id);
  if (!src) return null;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  copy.name = copy.name + ' (Copy)';
  copy.createdAt = Date.now();
  copy.updatedAt = Date.now();
  list.unshift(copy);
  saveCharacters(list);
  return copy;
}

// Export all characters to a JSON file.
function exportCharacters() {
  const list = loadCharacters();
  const data = { app: 'COCOCH', version: 1, exportedAt: new Date().toISOString(), characters: list };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cococh-characters-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Import characters from a JSON file. Returns { added, skipped }.
async function importCharacters(file) {
  const text = await file.text();
  const data = JSON.parse(text);
  let incoming = [];
  if (Array.isArray(data)) incoming = data;
  else if (data && Array.isArray(data.characters)) incoming = data.characters;
  else throw new Error('Unrecognized file format');

  const list = loadCharacters();
  let added = 0;
  let skipped = 0;
  for (const c of incoming) {
    if (!c || typeof c !== 'object' || !c.name || !c.characteristics) {
      skipped++;
      continue;
    }
    const id = c.id || 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    if (list.some((x) => x.id === id)) {
      // Remap id to avoid collisions.
      c.id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    } else {
      c.id = id;
    }
    c.updatedAt = Date.now();
    list.unshift(c);
    added++;
  }
  saveCharacters(list);
  return { added, skipped };
}

return { loadCharacters, saveCharacters, getCharacter, upsertCharacter, deleteCharacter, duplicateCharacter, exportCharacters, importCharacters };
})();

// Core dice utilities for Call of Cthulhu 7th edition.

function rollDie(sides) {
  return Math.floor(Math.random() * sides) + 1;
}

// Rolls `count` dice of `sides` sides. Returns { total, dice }.
function rollDice(count, sides) {
  const dice = [];
  let total = 0;
  for (let i = 0; i < count; i++) {
    const d = rollDie(sides);
    dice.push(d);
    total += d;
  }
  return { total, dice };
}

// Roll a d100 (units + tens).
function rollD100() {
  const units = rollDie(10);
  const tens = rollDie(10) - 1; // 0-9 for tens
  // A roll of 0 on both dice is 100.
  let result = tens * 10 + units;
  if (result === 0) result = 100;
  return result;
}

// Bonus/penalty dice (7e): roll an extra tens die, take best (bonus) or worst (penalty).
function rollD100WithPenalty(bonusDice) {
  // bonusDice > 0 => bonus (take lowest tens), < 0 => penalty (take highest tens)
  const count = Math.abs(bonusDice);
  const units = rollDie(10);
  const tensOptions = [];
  for (let i = 0; i <= count; i++) {
    tensOptions.push(rollDie(10) - 1);

// Small DOM + misc utilities.

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function debounce(fn, ms) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function halfFifth(value) {
  return { half: Math.floor(value / 2), fifth: Math.floor(value / 5) };
}

return { el, clear, escapeHtml, debounce, halfFifth };
})();
